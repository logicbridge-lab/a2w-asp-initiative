name: Validate A2W/ASP assets

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run repository validation tests
        run: python -m unittest discover -s tests -v
      - name: Run validator directly
        run: python tools/validate_assets.py
